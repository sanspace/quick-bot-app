steps:
  - name: gcr.io/cloud-builders/git
    args: ['fetch', '--depth=2']
    id: git-fetch
  # Upgrade pip
  - name: python
    entrypoint: python
    args: ['-m', 'pip', 'install', '--upgrade', 'pip']
    id: pip-upgrade
  # Install dependencies
  - name: python
    entrypoint: pip
    args: ['install', '-r', 'requirements-dev.txt', '--user']
    id: pip-install-deps
  # Install tooling
  - name: python
    entrypoint: python
    args: ['-m', 'pip', 'install', 'black', 'pylint', 'pytest', '--user']
    id: pip-install-tooling
  # Check License Text
  # - name: python
  #   entrypoint: 'python'
  #   args: ['config/scripts/check_license.py']
  #   id: license-check
  # Check Formatting with black
  - name: python
    entrypoint: python
    args: ['-m', 'black', '--check', '.']
    id: format-check
  # Check Linting with pylint
  # - name: python
  #   entrypoint: python
  #   args: ['-m', 'pylint', '.']
  #   id: lint-check
  # Run unit tests
  # - name: python
  #   entrypoint: python
  #   args: ['-m', 'pytest', '--junitxml=${SHORT_SHA}_test_log.xml']
  #   id: unit-tests

  # ========================================
  # == Step 1: Detect Changed Dirs =======
  # ========================================
  - name: gcr.io/cloud-builders/gcloud # Provides git, gcloud, and bash
    id: DetectDirs
    script: |
      #!/usr/bin/env bash
      set -e # Exit script on first error
      set -o pipefail # Fail pipeline if any command fails

      echo "Step 1: Detecting changed directories..."
      # Ensure Git history is available
      git fetch origin $BRANCH_NAME --depth=2 --single-branch || echo "Git fetch failed, proceeding"

      # Get changed files list
      PARENT_COMMIT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "4b825dc642cb6eb9a060e54bf8d69288fbee4904")
      CHANGED_FILES=$(git diff --name-only $PARENT_COMMIT $COMMIT_SHA)

      if [ -z "$CHANGED_FILES" ]; then
        echo "No files changed detected between $PARENT_COMMIT and $COMMIT_SHA. Exiting."
        # Create empty file to signal no builds needed in next step
        touch /workspace/dirs_to_build.txt
        exit 0
      fi

      echo "Files changed in commit $SHORT_SHA:"
      echo "${CHANGED_FILES}"
      echo "-------------------------------------"

      # --- Identify Directories to Build ---
      # 1. Find all potential application directories (depth 3, containing a Dockerfile)
      #    Example: Finds ./dir1/backend, ./dir1/frontend if they contain Dockerfile
      echo "Scanning for all buildable application directories (depth 3 with Dockerfile)..."
      ALL_BUILDABLE_DIRS=$(find . -maxdepth 3 -mindepth 3 -type f -name 'Dockerfile' -printf '%h\n' | sed 's|^\./||' | sort -u)

      if [ -z "$ALL_BUILDABLE_DIRS" ]; then
        echo "No directories containing Dockerfiles found at depth 3. Creating empty list file."
        touch /workspace/dirs_to_build.txt
        exit 0
      fi
      echo "Found potential buildable directories: ${ALL_BUILDABLE_DIRS}"

      # 2. Determine which of these buildable directories actually had changes within them
      declare -a final_build_array=()
      echo "Checking which buildable directories have changes..."
      for buildable_dir in $ALL_BUILDABLE_DIRS; do
        if echo "${CHANGED_FILES}" | grep -q -E "^${buildable_dir}/|^${buildable_dir}/Dockerfile$"; then
          echo "--> Change detected affecting: $buildable_dir"
          final_build_array+=("$buildable_dir")
        fi
      done
      FINAL_BUILD_LIST=$(echo "$final_build_array" | sed 's/ *$//') # Trim trailing space
      # --- End Directory Identification ---

      # Write the final list to a file in the workspace for the next step
      if [ ${#final_build_array[@]} -eq 0 ]; then
        echo "No changes detected within any buildable application directory. Creating empty list file."
        touch /workspace/dirs_to_build.txt
      else
        echo "Directories to build:"
        printf "  %s\n" "${final_build_array[@]}"
        printf "%s\n" "${final_build_array[@]}" > /workspace/dirs_to_build.txt
        echo "List saved to /workspace/dirs_to_build.txt"
      fi
      echo "Step 1 finished."
    # automapSubstitutions: true

  # ========================================
  # == Step 2: Build & Push Images =======
  # ========================================
  - name: gcr.io/cloud-builders/docker
    id: BuildPush
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      BUILD_FILE="/workspace/dirs_to_build.txt" # File created by previous step

      # Check if the file exists and is not empty (-s checks if size is greater than zero)
      if [ ! -s "$BUILD_FILE" ]; then
        echo "Step 2: No directories listed in $BUILD_FILE. Nothing to build."
        exit 0
      fi

      # --- Configuration ---
      # Use standardized substitutions with defaults for safety
      AR_LOCATION="${_AR_LOCATION:-us-central1}"
      AR_REPO="${_ARTIFACT_REGISTRY_REPO}" # Required, checked below

      # Validate required variables & Construct URL
      if [ -z "$AR_REPO" ]; then echo "Error: _ARTIFACT_REGISTRY_REPO substitution is empty!"; exit 1; fi
      ARTIFACT_REGISTRY_URL="${AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
      # --- End Configuration ---

      echo "Step 2: Starting build/push from list in $BUILD_FILE"
      echo "Artifact Registry Target: ${ARTIFACT_REGISTRY_URL}"
      echo "-------------------------------------"

      # Read the file line by line and build/push
      while IFS= read -r APP_DIR || [ -n "$APP_DIR" ]; do
        # Skip empty lines if any
        if [ -z "$APP_DIR" ]; then continue; fi

        IMAGE_SUFFIX=$(echo "$APP_DIR" | tr '/' '-')
        IMAGE_NAME="${ARTIFACT_REGISTRY_URL}/${IMAGE_SUFFIX}"

        echo "Processing directory: $APP_DIR"
        echo "Building image: ${IMAGE_NAME}:${SHORT_SHA}"

        # Docker commands WILL work here because this step uses the docker builder
        docker build -t "${IMAGE_NAME}:${SHORT_SHA}" \
                      -t "${IMAGE_NAME}:latest" \
                      --label=git-commit=$SHORT_SHA \
                      "$APP_DIR" # Build context is the specific app directory

        echo "Pushing image: ${IMAGE_NAME}"
        docker push "${IMAGE_NAME}:${SHORT_SHA}"
        docker push "${IMAGE_NAME}:latest"

        echo "Successfully built and pushed ${IMAGE_NAME}"
        echo "-------------------------------------"
      done < "$BUILD_FILE" # Feed the file into the while loop

      echo "Step 2: Build and push process completed."
    # automapSubstitutions: true
  # ========================================
  # == Step 3: Deploy to Cloud Run =======
  # ========================================
  - name: gcr.io/cloud-builders/gcloud
    id: DeployToCloudRun
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      BUILD_FILE="/workspace/dirs_to_build.txt"
      if [ ! -s "$BUILD_FILE" ]; then
        echo "Step 3: No directories listed in $BUILD_FILE. Nothing to deploy."
        exit 0
      fi

      # --- Configuration ---
      # Use substitutions with defaults
      CLOUD_RUN_REGION="${_CLOUD_RUN_REGION:-us-central1}"
      AR_LOCATION="${_AR_LOCATION:-us-central1}"
      AR_REPO="${_ARTIFACT_REGISTRY_REPO}"

      # Validate required variables
      if [ -z "$AR_REPO" ]; then echo "Error: _ARTIFACT_REGISTRY_REPO substitution is empty!"; exit 1; fi
      if [ -z "$CLOUD_RUN_REGION" ]; then echo "Error: _CLOUD_RUN_REGION substitution is empty!"; exit 1; fi
      # --- End Configuration ---


      echo "Step 3: Deploying services to Cloud Run region: ${CLOUD_RUN_REGION}"
      echo "Reading list from $BUILD_FILE..."
      echo "-------------------------------------"

      while IFS= read -r APP_DIR || [ -n "$APP_DIR" ]; do
        if [ -z "$APP_DIR" ]; then continue; fi

        # --- Derive names ---
        # Assumes service name matches image suffix (e.g., dir1-backend)
        SERVICE_NAME=$(echo "$APP_DIR" | tr '/' '-')
        IMAGE_SUFFIX=$SERVICE_NAME # Reuse the derived name
        IMAGE_URI="${AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_SUFFIX}:${SHORT_SHA}"
        # --- End Derive names ---

        echo "Deploying Service: ${SERVICE_NAME}"
        echo "         Image URI: ${IMAGE_URI}"
        echo "            Region: ${CLOUD_RUN_REGION}"

        # --- gcloud run deploy command ---
        # Add necessary flags based on your service requirements.
        # Common flags:
        # --allow-unauthenticated
        # --service-account=your-service-account@...
        # --set-env-vars=KEY1=val1,KEY2=val2
        # --update-secrets=SECRET_NAME=secret:latest,...
        # --memory=512Mi
        # --cpu=1
        # --concurrency=80
        # --platform=managed # (default) or --platform=gke
        gcloud run deploy "${SERVICE_NAME}" \
          --image="${IMAGE_URI}" \
          --region="${CLOUD_RUN_REGION}" \
          --quiet # Suppress interactive prompts during automated deployment

        # Add a small delay if needed, though usually not required
        # sleep 5

        echo "Successfully triggered deployment update for ${SERVICE_NAME}"
        echo "-------------------------------------"

      done < "$BUILD_FILE"

      echo "Step 3: Cloud Run deployment process finished."
substitutions:
  _ARTIFACT_REGISTRY_REPO: qbot
  _AR_LOCATION: us-central1 # Location of your Artifact Registry repo (e.g., us-central1)
  _CLOUD_RUN_REGION: us-central1 # Region where Cloud Run services should be deployed (e.g., us-central1)
options:
  logging: CLOUD_LOGGING_ONLY