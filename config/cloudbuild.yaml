steps:
  # ========================================
  # == Step 0: Fetch Git History =========
  # ========================================
  - name: gcr.io/cloud-builders/git
    id: GitFetch # Changed ID slightly
    # Fetch only required branch history, depth 2 for diffing parent
    args: ['fetch', '--depth=2', 'origin', '$BRANCH_NAME']

  # ========================================
  # == Step 1: Detect Changed Dirs =======
  # ========================================
  - name: gcr.io/cloud-builders/gcloud # Has git, bash, find etc.
    id: DetectDirs
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      OUTPUT_FILE="/workspace/changed_app_dirs.txt"

      echo "Step 1: Detecting changed directories..."

      # Git history should be present from previous step
      PARENT_COMMIT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "4b825dc642cb6eb9a060e54bf8d69288fbee4904")
      CHANGED_FILES=$(git diff --name-only $PARENT_COMMIT $COMMIT_SHA)

      if [ -z "$CHANGED_FILES" ]; then
        echo "No files changed detected. Creating empty list file."
        # Create empty file to signal no builds needed in next step
        touch $OUTPUT_FILE
        exit 0
      fi
      echo "Files changed in commit $SHORT_SHA:"
      echo "${CHANGED_FILES}"
      echo "-------------------------------------"

      # --- Identify Directories to Build ---
      # 1. Find all potential application directories (depth 3, containing a Dockerfile)
      #    Example: Finds ./dir1/backend, ./dir1/frontend if they contain Dockerfile
      echo "Scanning for all buildable application directories (depth 3 with Dockerfile)..."
      ALL_BUILDABLE_DIRS=$(find . -maxdepth 3 -mindepth 3 -type f -name 'Dockerfile' -printf '%h\n' | sed 's|^\./||' | sort -u)
      if [ -z "$ALL_BUILDABLE_DIRS" ]; then
        echo "No directories with Dockerfiles found at depth 3. Creating empty list file."
        touch $OUTPUT_FILE
        exit 0
      fi
      echo "Found potential buildable directories: ${ALL_BUILDABLE_DIRS}"

      # 2. Determine which of these buildable directories actually had changes within them
      declare -a final_dirs_array=() # Renamed array
      echo "Checking which buildable directories have changes..."
      for buildable_dir in $ALL_BUILDABLE_DIRS; do
        if echo "${CHANGED_FILES}" | grep -q -E "^${buildable_dir}/|^${buildable_dir}/Dockerfile$"; then
          echo "--> Change detected affecting: $buildable_dir"
          final_dirs_array+=("$buildable_dir")
        fi
      done
      # --- End Directory Identification ---

      # Write the final list to a file in the workspace for the next step
      if [ ${#final_dirs_array[@]} -eq 0 ]; then
        echo "No changes in buildable dirs. Creating empty list file."
        touch $OUTPUT_FILE
      else
        echo "Directories affected:"
        printf "  %s\n" "${final_dirs_array[@]}"
        printf "%s\n" "${final_dirs_array[@]}" > $OUTPUT_FILE
        echo "List saved to $OUTPUT_FILE"
      fi
      echo "Step 1 finished."

  # ========================================
  # == Step 2: Setup Python Env =========
  # ========================================
  # Upgrade pip
  - name: python:3.9 # Using a specific python version image is often better
    entrypoint: python
    args: ['-m', 'pip', 'install', '--upgrade', 'pip']
    id: pip-upgrade
  # Install dependencies (consider if needed globally or per-app)
  - name: python:3.9
    entrypoint: pip
    args: ['install', '-r', 'requirements-dev.txt'] # Removed --user
    id: pip-install-deps
  # Install tooling (maybe redundant if in requirements-dev)
  - name: python:3.9
    entrypoint: pip
    args: ['install', 'black', 'pylint', 'pytest'] # Removed --user
    id: pip-install-tooling

  # ========================================
  # == Step 3: Per-Directory Checks ======
  # ========================================
  # Check Formatting with black (only on changed dirs)
  - name: python:3.9
    id: FormatCheck
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      INPUT_FILE="/workspace/changed_app_dirs.txt"
      echo "Step 3.1: Running format check (black) on changed directories..."

      if [ ! -s "$INPUT_FILE" ]; then
        echo "No changed directories listed in $INPUT_FILE. Skipping format check."
        exit 0
      fi

      FAILURE_DETECTED=0
      while IFS= read -r APP_DIR || [ -n "$APP_DIR" ]; do
        if [ -z "$APP_DIR" ]; then continue; fi
        echo "--- Checking format in: $APP_DIR ---"
        # Use python -m to ensure correct executable is found
        if ! python -m black --check "$APP_DIR"; then
          echo "!!! Black formatting check failed for $APP_DIR !!!"
          FAILURE_DETECTED=1
        fi
      done < "$INPUT_FILE"

      if [ "$FAILURE_DETECTED" -ne 0 ]; then
         echo "Format check failed in one or more directories."
         exit 1 # Fail the build step
      fi
      echo "Format check passed for all changed directories."

