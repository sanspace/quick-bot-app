  #   args: ['build', '-t', 
  #         'us-central1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/backend:${SHORT_SHA}', '.']
  # # Docker push to Google Artifact Registry
