  # ========================================
  # == Step 4: Build & Push Images =======
  # ========================================
  - name: gcr.io/cloud-builders/docker
    id: BuildPush
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      BUILD_FILE="/workspace/changed_app_dirs.txt" # File created by previous step

      # Check if the file exists and is not empty (-s checks if size is greater than zero)
      if [ ! -s "$BUILD_FILE" ]; then
        echo "Step 4: No directories listed in $BUILD_FILE. Nothing to build."
        exit 0
      fi

      # --- Configuration ---
      # Use standardized substitutions with defaults for safety
      AR_LOCATION="${_AR_LOCATION:-us-central1}"
      AR_REPO="${_ARTIFACT_REGISTRY_REPO:-qbot}" # Required, checked below

      # Validate required variables & Construct URL
      if [ -z "$AR_REPO" ]; then echo "Error: _ARTIFACT_REGISTRY_REPO substitution is empty!"; exit 1; fi
      ARTIFACT_REGISTRY_URL="${AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
      # --- End Configuration ---

      echo "Step 4: Starting build/push from list in $BUILD_FILE"
      echo "Artifact Registry Target: ${ARTIFACT_REGISTRY_URL}"
      echo "-------------------------------------"

      # Read the file line by line and build/push
      while IFS= read -r APP_DIR || [ -n "$APP_DIR" ]; do
        # Skip empty lines if any
        if [ -z "$APP_DIR" ]; then continue; fi

        IMAGE_SUFFIX=$(echo "$APP_DIR" | tr '/' '-')
        IMAGE_NAME="${ARTIFACT_REGISTRY_URL}/${IMAGE_SUFFIX}"

        echo "Processing directory: $APP_DIR"
        echo "Building image: ${IMAGE_NAME}:${SHORT_SHA}"

        docker build -t "${IMAGE_NAME}:${SHORT_SHA}" \
                      -t "${IMAGE_NAME}:latest" \
                      --label=git-commit=$SHORT_SHA \
                      "$APP_DIR" # Build context is the specific app directory

        echo "Pushing image: ${IMAGE_NAME}"
        docker push "${IMAGE_NAME}:${SHORT_SHA}"
        docker push "${IMAGE_NAME}:latest"

        echo "Successfully built and pushed ${IMAGE_NAME}"
        echo "-------------------------------------"
      done < "$BUILD_FILE" # Feed the file into the while loop
      
      echo "Step 4: Build and push process completed."
    # removed automapSubstitutions

  # ========================================
  # == Step 5: Deploy to Cloud Run =======
  # ========================================
  - name: gcr.io/cloud-builders/gcloud
    id: DeployToCloudRun
    script: |
      #!/usr/bin/env bash
      set -e
      set -o pipefail

      BUILD_FILE="/workspace/changed_app_dirs.txt" # Use the renamed file
      if [ ! -s "$BUILD_FILE" ]; then
        echo "Step 5: No directories listed in $BUILD_FILE. Nothing to deploy."
        exit 0
      fi

      # --- Configuration ---
      # Use substitutions with defaults
      CLOUD_RUN_REGION="${_CLOUD_RUN_REGION:-us-central1}"
      AR_LOCATION="${_AR_LOCATION:-us-central1}"
      AR_REPO="${_ARTIFACT_REGISTRY_REPO:-qbot}"

      # Validate required variables
      if [ -z "$AR_REPO" ]; then echo "Error: _ARTIFACT_REGISTRY_REPO empty!"; exit 1; fi
      if [ -z "$CLOUD_RUN_REGION" ]; then echo "Error: _CLOUD_RUN_REGION empty!"; exit 1; fi
      # --- End Configuration ---

      echo "Step 5: Deploying services to Cloud Run region: ${CLOUD_RUN_REGION}"
      echo "Reading list from $BUILD_FILE..."
      echo "-------------------------------------"

      while IFS= read -r APP_DIR || [ -n "$APP_DIR" ]; do
        if [ -z "$APP_DIR" ]; then continue; fi

        # --- Derive names ---
        # Assumes service name matches image suffix (e.g., dir1-backend)
        SERVICE_NAME=$(echo "$APP_DIR" | tr '/' '-')
        IMAGE_SUFFIX=$SERVICE_NAME
        IMAGE_URI="${AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_SUFFIX}:${SHORT_SHA}"
        # --- End Derive names ---

        echo "Deploying Service: ${SERVICE_NAME}"
        echo "         Image URI: ${IMAGE_URI}"
        echo "            Region: ${CLOUD_RUN_REGION}"

        # --- gcloud run deploy command ---
        # Add necessary flags based on your service requirements.
        # Common flags:
        # --allow-unauthenticated
        # --service-account=your-service-account@...
        # --set-env-vars=KEY1=val1,KEY2=val2
        # --update-secrets=SECRET_NAME=secret:latest,...
        # --memory=512Mi
        # --cpu=1
        # --concurrency=80
        # --platform=managed # (default) or --platform=gke
        gcloud run deploy "${SERVICE_NAME}" \
          --image="${IMAGE_URI}" \
          --region="${CLOUD_RUN_REGION}" \
          --quiet # Suppress interactive prompts during automated deployment
        
        echo "Successfully triggered deployment update for ${SERVICE_NAME}"
        echo "-------------------------------------"

      done < "$BUILD_FILE"

      echo "Step 5: Cloud Run deployment process finished."
    automapSubstitutions: true

# ========================================
# == Substitutions & Options ===========
# ========================================
substitutions:
  _ARTIFACT_REGISTRY_REPO: qbot
  _AR_LOCATION: us-central1
  _CLOUD_RUN_REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
  # machineType: E2_HIGHCPU_8